apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: prod
servers: 1
agents: 1
network: idp-net
ports:
  - port: 8082:80
    nodeFilters:
      - loadbalancer
  - port: 8445:443
    nodeFilters:
      - loadbalancer
options:
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: false
  k3s:
    extraArgs:
      - arg: --tls-san=k3d-prod-serverlb
        nodeFilters:
          - server:*
