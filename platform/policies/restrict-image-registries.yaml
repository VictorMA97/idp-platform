# Solo se permiten imágenes de orígenes autorizados en los namespaces de equipo.
# Complementa a verify-image-signatures: esa política solo verifica las imágenes que coinciden
# con su patrón; esta evita que se cuele una imagen de otro origen (por ejemplo, docker.io).
#
# INVARIANTE: todo prefijo autorizado aquí debe estar cubierto por una política de verificación
# de firma (verify-image-signatures.yaml). Por eso los prefijos son una convención de nombre (svc-)
# o repos concretos (p. ej. idp-sample-app, que añade `make sample-app`) y no toda la cuenta de GHCR: si no, cualquier otro paquete sin
# firmar de la cuenta pasaría. Para autorizar otro origen, añade su prefijo aquí Y su patrón allí.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-image-registries
spec:
  validationActions: [Audit]  # idp:policy-mode
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: idp.dev/team
          operator: Exists
    resourceRules:
      - apiGroups: ['']
        apiVersions: ['v1']
        resources: ['pods']
        operations: ['CREATE', 'UPDATE']
  variables:
    - name: allowedPrefixes
      expression: "['ghcr.io/victorma97/idp-sample-app', 'ghcr.io/victorma97/svc-']"  # idp:allowed-prefixes
    - name: allImages
      expression: >-
        object.spec.containers.map(c, c.image) +
        (has(object.spec.initContainers) ? object.spec.initContainers.map(c, c.image) : [])
  validations:
    - expression: >-
        variables.allImages.all(i, variables.allowedPrefixes.exists(p, i.startsWith(p)))
      message: 'Solo se permiten imágenes de orígenes autorizados (ghcr.io/victorma97/svc-* y los repos autorizados)'
