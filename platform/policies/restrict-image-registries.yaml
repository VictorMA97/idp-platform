# Solo se permiten imágenes de orígenes autorizados en los namespaces de equipo.
# Complementa a verify-image-signatures: esa política solo verifica las imágenes que coinciden
# con su patrón; esta evita que se cuele una imagen de otro origen (por ejemplo, docker.io).
#
# INVARIANTE: todo prefijo autorizado aquí debe estar cubierto por una política de verificación
# de firma (verify-image-signatures.yaml). Por eso los prefijos son repos concretos (idp-sample-app)
# o una convención de nombre (svc-) y no toda la cuenta de GHCR: si no, cualquier otro paquete sin
# firmar de la cuenta pasaría. Para autorizar otro origen, añade su prefijo aquí Y su patrón allí.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-image-registries
spec:
  validationActions: [Deny]  # idp:policy-mode
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: idp.dev/team
          operator: Exists
    resourceRules:
      - apiGroups: ['']
        apiVersions: ['v1']
        resources: ['pods']
        operations: ['CREATE', 'UPDATE']
  variables:
    - name: allowedPrefixes
      expression: "['ghcr.io/victorma97/idp-sample-app', 'ghcr.io/victorma97/svc-']"
    - name: allImages
      expression: >-
        object.spec.containers.map(c, c.image) +
        (has(object.spec.initContainers) ? object.spec.initContainers.map(c, c.image) : [])
  validations:
    - expression: >-
        variables.allImages.all(i, variables.allowedPrefixes.exists(p, i.startsWith(p)))
      message: 'Solo se permiten imágenes de orígenes autorizados (ghcr.io/victorma97/idp-sample-app y ghcr.io/victorma97/svc-*)'
