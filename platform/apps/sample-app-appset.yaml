# Plantilla (NO la sincroniza Argo CD: está fuera de platform/apps).
# scripts/enable-sample-app.sh la copia a platform/apps/ con la URL del repo de la app.
#
# Despliega la app de ejemplo en cada spoke registrado. El values de cada entorno
# (chart/values-dev.yaml / values-prod.yaml, en el repo de la app) lo reescribe el
# pipeline de CI con el tag y el digest de la imagen firmada.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: sample-app
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            idp.dev/role: spoke
  template:
    metadata:
      name: 'sample-app-{{.name}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/VictorMA97/idp-sample-app.git  # idp:app-repo-url
        targetRevision: HEAD
        path: chart
        helm:
          valueFiles:
            - values.yaml
            - 'values-{{.metadata.labels.env}}.yaml'
      destination:
        server: '{{.server}}'
        namespace: team-demo
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        # El namespace lo crea la línea base (baseline-<env>); si esta app llega antes, reintenta
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 2m
